<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هەفتەبازاڕی سلێمانی - سیستەمی نرخ</title>
<link rel="icon" href="logo.png">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
min-height:100vh;
background:
linear-gradient(
to bottom,
rgba(210,0,0,.18) 0 33.33%,
rgba(255,255,255,.92) 33.33% 66.66%,
rgba(0,150,70,.18) 66.66% 100%
);
}

.header{
text-align:center;
padding:20px 15px 25px;
background:linear-gradient(
to bottom,
#d71920 0 33.33%,
#fff 33.33% 66.66%,
#168b45 66.66% 100%
);
position:relative;
overflow:hidden;
}

.header img{
width:90px;
height:90px;
object-fit:contain;
border-radius:50%;
background:#fff;
box-shadow:0 3px 10px rgba(0,0,0,.25);
position:relative;
z-index:2;
}

.header h1{
margin:10px 0 0;
font-size:22px;
position:relative;
z-index:2;
}

.header p{
margin:6px 0 0;
position:relative;
z-index:2;
font-size:13px;
}

.container{
max-width:600px;
margin:auto;
padding:18px;
}

.card{
background:rgba(255,255,255,.96);
border-radius:18px;
padding:18px;
margin-bottom:15px;
box-shadow:0 5px 20px rgba(0,0,0,.12);
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input{
width:100%;
padding:15px;
border:1px solid #ccc;
border-radius:12px;
font-size:18px;
outline:none;
margin-bottom:10px;
}

input:focus{
border-color:#168b45;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:#168b45;
color:white;
margin-top:5px;
}

button:hover{
opacity:.9;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.dark{
background:#333;
}

.btn-row{
display:flex;
gap:10px;
}

.btn-row button{
margin-top:5px;
}

.price-box{
margin-top:15px;
background:#f4f4f4;
border-radius:15px;
text-align:center;
padding:20px;
}

.product-name{
font-size:20px;
font-weight:bold;
}

.price{
font-size:42px;
font-weight:bold;
color:#168b45;
margin:8px;
}

.currency{
font-size:16px;
}

.product-list{
margin-top:15px;
}

.delete{
width:auto;
padding:8px 12px;
background:#d71920;
font-size:13px;
}

.hidden{
display:none !important;
}

.message{
color:#777;
text-align:center;
line-height:1.8;
}

.qty-row{
display:flex;
gap:10px;
align-items:center;
margin-bottom:10px;
}

.qty-row input{
margin-bottom:0;
text-align:center;
}

.qty-row label{
margin:0;
white-space:nowrap;
}

.add-cart-btn{
background:#d71920;
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 5px;
border-bottom:1px solid #ddd;
gap:10px;
}

.cart-item-info{
flex:1;
}

.cart-item-name{
font-weight:bold;
}

.cart-item-detail{
font-size:13px;
color:#777;
margin-top:4px;
}

.cart-item-subtotal{
font-weight:bold;
color:#168b45;
white-space:nowrap;
}

.total-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 5px 5px;
margin-top:10px;
border-top:2px solid #168b45;
font-size:19px;
font-weight:bold;
}

.total-row .total-amount{
color:#168b45;
font-size:26px;
}

.footer{
text-align:center;
padding:15px;
}

.admin-link{
display:inline-block;
color:#555;
font-size:13px;
text-decoration:none;
padding:8px 16px;
border:1px solid #bbb;
border-radius:20px;
background:rgba(255,255,255,.6);
}

.admin-link:hover{
background:rgba(255,255,255,.9);
}

.scan-btn{
background:#333;
}

.scanner-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:1000;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:15px;
}

.scanner-notice{
background:#168b45;
color:#fff;
padding:12px 18px;
border-radius:12px;
text-align:center;
font-size:14px;
margin-bottom:14px;
max-width:420px;
box-shadow:0 4px 12px rgba(0,0,0,.3);
}

.scanner-box{
position:relative;
width:100%;
max-width:420px;
background:#000;
border-radius:14px;
overflow:hidden;
}

.scanner-box video, .scanner-box canvas{
width:100% !important;
height:auto !important;
display:block;
}

.scanner-frame{
position:absolute;
top:35%;
left:8%;
right:8%;
height:30%;
border:3px solid #e5bd00;
border-radius:8px;
pointer-events:none;
}

.scanner-close{
width:auto;
padding:10px 25px;
background:#d71920;
margin-top:14px;
}

.toast{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
background:#333;
color:#fff;
padding:12px 22px;
border-radius:30px;
font-size:14px;
z-index:2000;
box-shadow:0 4px 14px rgba(0,0,0,.3);
text-align:center;
max-width:90%;
}
</style>
</head>

<body>

<div class="header">
<img src="logo.png" alt="هەفتەبازاڕی سلێمانی">
<h1>هەفتەبازاڕی سلێمانی</h1>
<p>دۆزینەوەی نرخ و حسابکردنی کۆی کڕین بە بارکۆد</p>
</div>

<div class="container">

<div class="card">

<label>بارکۆدی کاڵا</label>

<input
id="barcode"
type="text"
inputmode="numeric"
placeholder="بارکۆد لێرە بنووسە..."
>

<div class="qty-row">
<label style="min-width:45px;">دانە:</label>
<input id="qty" type="number" inputmode="numeric" value="1" min="1">
</div>

<div class="btn-row">
<button onclick="searchProduct()">
🔎 پیشاندانی نرخ
</button>
<button class="scan-btn" onclick="openScanner()">
📷 سکانکردن
</button>
</div>

<button class="dark" onclick="clearSearch()">
پاککردنەوە
</button>

<div class="price-box" id="result">
<div class="message">
بارکۆدی کاڵاکە داخڵ بکە یان سکانی بکە بۆ پیشاندانی نرخ
</div>
</div>

</div>

<div class="card">

<h3>🧾 لیستی کڕین</h3>

<div id="cartList" class="product-list">
<div class="message">
هیچ کاڵایەک زیاد نەکراوە بۆ لیستی کڕین.
</div>
</div>

<div class="total-row">
<span>کۆی گشتی:</span>
<span><span class="total-amount" id="cartTotal">0</span> دینار</span>
</div>

<button class="dark" onclick="clearCart()">
🗑️ بەتاڵکردنەوەی لیست
</button>

</div>

</div>

<div class="footer">
<a class="admin-link" href="admin.html">🔒 بۆ کارمەندان و بەڕێوەبەران</a>
</div>

<div id="scannerOverlay" class="scanner-overlay hidden">
<div class="scanner-notice">
کامیرا لەسەر بارکۆدەکە ڕابگرە هەتا بەخۆکار بیخوێنێتەوە
</div>
<div class="scanner-box" id="scannerBox">
<div class="scanner-frame"></div>
</div>
<button class="scanner-close" onclick="closeScanner()">
✖ داخستنی سکانەر
</button>
</div>

<div id="toast" class="toast hidden"></div>

<script src="firebase-config.js"></script>
<script>

let products = [];
let cart = [];
let lastFoundProduct = null;
let scannerActive = false;

function showToast(msg){
let t = document.getElementById("toast");
t.textContent = msg;
t.classList.remove("hidden");
setTimeout(()=>t.classList.add("hidden"), 2200);
}

// Live sync from Firestore - everyone always sees the latest prices
db.collection("products").onSnapshot(function(snapshot){
products = snapshot.docs.map(doc=>({ id: doc.id, ...doc.data() }));
}, function(err){
showToast("❌ نەتوانرا پەیوەندی بە داتابەیسەوە بکرێت");
console.error(err);
});

function searchProduct(){

let barcode =
document.getElementById("barcode").value.trim();

let result =
document.getElementById("result");

lastFoundProduct = null;

if(barcode===""){

result.innerHTML=`
<div class="message">
تکایە بارکۆدی کاڵا داخڵ بکە.
</div>`;

return;

}

let product =
products.find(
item=>String(item.barcode)===barcode
);

if(!product){

result.innerHTML=`
<div class="message">
❌ ئەم بارکۆدە نەدۆزرایەوە
</div>`;

return;

}

lastFoundProduct = product;

result.innerHTML=`

<div class="product-name">
${product.name}
</div>

<div class="price">
${Number(product.price).toLocaleString()}
</div>

<div class="currency">
دینار
</div>

<button class="add-cart-btn" onclick="addToCart()" style="margin-top:12px;">
➕ زیادکردن بۆ لیستی کڕین
</button>

`;

}

function addToCart(){

if(!lastFoundProduct) return;

let qty = Number(document.getElementById("qty").value);

if(!qty || qty<=0) qty = 1;

let existing =
cart.find(item=>String(item.barcode)===String(lastFoundProduct.barcode));

if(existing){

existing.qty += qty;

}else{

cart.push({
name:lastFoundProduct.name,
barcode:lastFoundProduct.barcode,
price:lastFoundProduct.price,
qty:qty
});

}

displayCart();

clearSearch();

}

function removeFromCart(index){

cart.splice(index,1);

displayCart();

}

function clearCart(){

if(cart.length===0) return;

if(!confirm("دڵنیایت لە بەتاڵکردنەوەی لیستی کڕین؟"))
return;

cart = [];

displayCart();

}

function displayCart(){

let list = document.getElementById("cartList");

let total = 0;

if(cart.length===0){

list.innerHTML=`
<div class="message">
هیچ کاڵایەک زیاد نەکراوە بۆ لیستی کڕین.
</div>`;

document.getElementById("cartTotal").textContent = "0";

return;

}

list.innerHTML="";

cart.forEach((item,index)=>{

let subtotal = item.price * item.qty;

total += subtotal;

let row = document.createElement("div");

row.className = "cart-item";

row.innerHTML=`

<div class="cart-item-info">
<div class="cart-item-name">${item.name}</div>
<div class="cart-item-detail">
${Number(item.price).toLocaleString()} × ${item.qty}
</div>
</div>

<div class="cart-item-subtotal">
${subtotal.toLocaleString()}
</div>

<button
class="delete"
style="width:auto;"
onclick="removeFromCart(${index})">
سڕینەوە
</button>

`;

list.appendChild(row);

});

document.getElementById("cartTotal").textContent = total.toLocaleString();

}

function clearSearch(){

document.getElementById("barcode").value="";
document.getElementById("qty").value="1";

lastFoundProduct = null;

document.getElementById("result").innerHTML=`
<div class="message">
بارکۆدی کاڵاکە داخڵ بکە یان سکانی بکە بۆ پیشاندانی نرخ
</div>`;

document.getElementById("barcode").focus();

}

document
.getElementById("barcode")
.addEventListener("keydown",function(event){

if(event.key==="Enter"){
searchProduct();
}

});

// ---------- Camera barcode scanner (Quagga) ----------

function openScanner(){

document.getElementById("scannerOverlay").classList.remove("hidden");

Quagga.init({
inputStream:{
type:"LiveStream",
target: document.getElementById("scannerBox"),
constraints:{
facingMode:"environment"
}
},
decoder:{
readers:["ean_reader","ean_8_reader","code_128_reader","upc_reader"]
}
}, function(err){

if(err){
showToast("❌ کامیرا نەدۆزرایەوە یان ڕێگە نەدرا");
closeScanner();
console.error(err);
return;
}

Quagga.start();
scannerActive = true;

});

Quagga.onDetected(onBarcodeDetected);

}

function onBarcodeDetected(data){

if(!scannerActive) return;

let code = data.codeResult.code;

document.getElementById("barcode").value = code;

closeScanner();

searchProduct();

}

function closeScanner(){

if(scannerActive){
Quagga.offDetected(onBarcodeDetected);
Quagga.stop();
scannerActive = false;
}

document.getElementById("scannerOverlay").classList.add("hidden");

}

displayCart();

</script>

</body>
</html>
