<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بەڕێوەبردنی کاڵاکان - هەفتەبازاڕی سلێمانی</title>
<link rel="icon" href="logo.png">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
min-height:100vh;
background:
linear-gradient(
to bottom,
rgba(210,0,0,.18) 0 33.33%,
rgba(255,255,255,.92) 33.33% 66.66%,
rgba(0,150,70,.18) 66.66% 100%
);
}

.header{
text-align:center;
padding:20px 15px;
background:linear-gradient(
to bottom,
#d71920 0 33.33%,
#fff 33.33% 66.66%,
#168b45 66.66% 100%
);
}

.header img{
width:70px;
height:70px;
object-fit:contain;
border-radius:50%;
background:#fff;
box-shadow:0 3px 10px rgba(0,0,0,.25);
}

.header h1{
margin:10px 0 0;
font-size:20px;
}

.container{
max-width:600px;
margin:auto;
padding:18px;
}

.card{
background:rgba(255,255,255,.96);
border-radius:18px;
padding:18px;
margin-bottom:15px;
box-shadow:0 5px 20px rgba(0,0,0,.12);
}

label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

input, select{
width:100%;
padding:15px;
border:1px solid #ccc;
border-radius:12px;
font-size:18px;
outline:none;
margin-bottom:10px;
font-family:inherit;
background:#fff;
}

input:focus, select:focus{
border-color:#168b45;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:17px;
font-weight:bold;
cursor:pointer;
background:#168b45;
color:white;
margin-top:5px;
}

button:hover{
opacity:.9;
}

button:disabled{
opacity:.6;
cursor:not-allowed;
}

.dark{
background:#333;
}

.scan-btn{
background:#333;
}

.hidden{
display:none !important;
}

.message{
color:#777;
text-align:center;
line-height:1.8;
}

.product-list{
margin-top:15px;
}

.product{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px 5px;
border-bottom:1px solid #ddd;
gap:10px;
}

.product-thumb{
width:52px;
height:52px;
border-radius:10px;
object-fit:cover;
background:#eee;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

.product-info{
flex:1;
}

.product-name-small{
font-weight:bold;
}

.product-code{
font-size:13px;
color:#777;
margin-top:4px;
}

.btn-group{
display:flex;
flex-direction:column;
gap:6px;
}

.edit-btn{
width:auto;
padding:8px 12px;
background:#333;
font-size:13px;
}

.delete{
width:auto;
padding:8px 12px;
background:#d71920;
font-size:13px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.logout-btn{
width:auto;
padding:8px 16px;
background:#d71920;
font-size:13px;
margin:0;
}

.back-link{
display:block;
text-align:center;
color:#555;
font-size:13px;
margin-top:10px;
text-decoration:none;
}

.error-msg{
color:#d71920;
text-align:center;
font-size:14px;
margin-top:5px;
}

.image-preview{
width:100%;
max-width:200px;
display:block;
margin:0 auto 12px;
border-radius:12px;
border:1px solid #ddd;
}

.category-row{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 5px;
border-bottom:1px solid #ddd;
gap:10px;
}

.category-row .cat-name{
flex:1;
font-weight:bold;
}

.category-row .btn-group{
flex-direction:row;
}

.scanner-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.92);
z-index:1000;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
padding:15px;
}

.scanner-notice{
background:#168b45;
color:#fff;
padding:12px 18px;
border-radius:12px;
text-align:center;
font-size:14px;
margin-bottom:14px;
max-width:420px;
box-shadow:0 4px 12px rgba(0,0,0,.3);
}

.scanner-box{
position:relative;
width:100%;
max-width:420px;
background:#000;
border-radius:14px;
overflow:hidden;
}

.scanner-box video, .scanner-box canvas{
width:100% !important;
height:auto !important;
display:block;
}

.scanner-close{
width:auto;
padding:10px 25px;
background:#d71920;
margin-top:14px;
}
</style>
</head>

<body>

<div class="header">
<img src="logo.png" alt="هەفتەبازاڕی سلێمانی">
<h1>بەڕێوەبردنی کاڵاکان</h1>
</div>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginCard">

<label>ئیمەیل</label>
<input id="loginEmail" type="email" placeholder="ئیمەیلی کارمەند">

<label>وشەی نهێنی</label>
<input id="loginPassword" type="password" placeholder="وشەی نهێنی">

<button id="loginBtn" onclick="login()">🔑 چوونەژوورەوە</button>

<div id="loginError" class="error-msg hidden"></div>

<a class="back-link" href="index.html">↩ گەڕانەوە بۆ فرۆشگا</a>

</div>

<!-- ADMIN PANEL (hidden until logged in) -->
<div id="adminPanel" class="hidden">

<div class="card">
<div class="top-bar">
<span id="userLabel" style="font-size:13px;color:#555;"></span>
<button class="logout-btn" onclick="logout()">دەرچوون</button>
</div>
<a class="back-link" href="index.html">↩ گەڕانەوە بۆ فرۆشگا</a>
</div>

<div class="card">

<h3>🏷️ بەڕێوەبردنی جۆرەکان</h3>

<input id="newCategoryName" type="text" placeholder="ناوی جۆری نوێ...">
<button onclick="addCategory()">➕ زیادکردنی جۆر</button>

<div id="categoryManageList" class="product-list">
<div class="message">چاوەڕوان بە...</div>
</div>

</div>

<div class="card">

<h3 id="formTitle">➕ زیادکردنی کاڵای نوێ</h3>

<img id="imagePreview" class="image-preview hidden">

<label>وێنەی کاڵا</label>
<input id="productImageInput" type="file" accept="image/*">

<label>ناوی کاڵا</label>
<input id="productName" type="text" placeholder="ناوی کاڵا">

<label>بارکۆد</label>
<input id="productBarcode" type="text" inputmode="numeric" placeholder="بارکۆدی کاڵا">
<button type="button" class="scan-btn" onclick="openScanner()">📷 سکانکردنی بارکۆد بە کامیرا</button>

<label style="margin-top:10px;">جۆری کاڵا</label>
<select id="productCategory"></select>

<label>نرخ بە دینار</label>
<input id="productPrice" type="number" inputmode="decimal" placeholder="بۆ نموونە 1500">

<button id="saveBtn" onclick="saveProduct()">💾 پاشەکەوتکردن</button>
<button id="cancelEditBtn" class="dark hidden" onclick="cancelEdit()">✖ پاشگەزبوونەوە</button>

</div>

<div class="card">

<h3>📦 هەموو کاڵاکان</h3>

<div id="totalCount" class="message" style="text-align:right;margin-bottom:10px;">
کۆی کاڵاکان: 0
</div>

<div id="productList" class="product-list">
<div class="message">چاوەڕوان بە، بارکردن...</div>
</div>

</div>

</div>

</div>

<div id="scannerOverlay" class="scanner-overlay hidden">
<div class="scanner-notice">
کامیرا لەسەر بارکۆدەکە ڕابگرە هەتا بەخۆکار بیخوێنێتەوە
</div>
<div class="scanner-box" id="scannerBox"></div>
<button class="scanner-close" onclick="closeScanner()">
✖ داخستنی سکانەر
</button>
</div>

<script src="firebase-config.js"></script>
<script>

const SEED_CATEGORIES = [
"خواردنی تازە",
"دانەوێڵە و کۆنسێرڤ",
"شیرینی و بەرهەمی شیر",
"خواردنەوەکان",
"پاکژی و خۆشبۆنکردنەوە",
"کەلوپەلی ماڵ",
"هیتر"
];

let products = [];
let categories = [];
let hasSeeded = false;
let editingId = null;
let currentImageData = null;
let html5QrCode = null;
let scannerActive = false;

function populateCategorySelect(){
let sel = document.getElementById("productCategory");
let prev = sel.value;
sel.innerHTML = categories.map(c=>`<option value="${c.name}">${c.name}</option>`).join("");
if(categories.some(c=>c.name===prev)){
sel.value = prev;
}
}

// ---------- Categories (live sync, editable by staff) ----------

db.collection("categories").onSnapshot(async function(snapshot){

if(snapshot.empty && !hasSeeded){

hasSeeded = true;

try{
const batch = db.batch();
SEED_CATEGORIES.forEach(name=>{
const ref = db.collection("categories").doc();
batch.set(ref, {name:name});
});
await batch.commit();
}catch(err){
console.error(err);
}

return;

}

categories = snapshot.docs.map(doc=>({ id: doc.id, ...doc.data() }));

populateCategorySelect();
displayCategories();

});

function displayCategories(){

let list = document.getElementById("categoryManageList");

if(categories.length===0){
list.innerHTML = `<div class="message">هێشتا هیچ جۆرێک نییە.</div>`;
return;
}

list.innerHTML = "";

categories.forEach(cat=>{

let row = document.createElement("div");
row.className = "category-row";

row.innerHTML = `
<div class="cat-name">${cat.name}</div>
<div class="btn-group">
<button class="edit-btn" onclick="renameCategory('${cat.id}','${cat.name.replace(/'/g,"\\'")}')">✏️</button>
<button class="delete" onclick="deleteCategory('${cat.id}','${cat.name.replace(/'/g,"\\'")}')">🗑️</button>
</div>
`;

list.appendChild(row);

});

}

async function addCategory(){

let input = document.getElementById("newCategoryName");
let name = input.value.trim();

if(name===""){
return;
}

if(categories.some(c=>c.name===name)){
alert("❌ ئەم جۆرە پێشتر هەیە.");
return;
}

try{
await db.collection("categories").add({name:name});
input.value = "";
}catch(err){
alert("❌ کێشەیەک ڕوویدا لە زیادکردنی جۆر.");
console.error(err);
}

}

async function renameCategory(id, oldName){

let newName = prompt("ناوی نوێی جۆر بنووسە:", oldName);

if(newName===null) return;

newName = newName.trim();

if(newName==="" || newName===oldName) return;

if(categories.some(c=>c.name===newName && c.id!==id)){
alert("❌ ئەم ناوە پێشتر هەیە.");
return;
}

try{

const batch = db.batch();

batch.update(db.collection("categories").doc(id), {name:newName});

const affected = await db.collection("products").where("category","==",oldName).get();
affected.forEach(doc=>{
batch.update(doc.ref, {category:newName});
});

await batch.commit();

}catch(err){
alert("❌ کێشەیەک ڕوویدا لە نوێکردنەوەی جۆر.");
console.error(err);
}

}

async function deleteCategory(id, name){

if(!confirm(`دڵنیایت لە سڕینەوەی "${name}"؟ کاڵاکانی ئەم جۆرە بەبێ جۆر دەمێننەوە.`))
return;

try{
await db.collection("categories").doc(id).delete();
}catch(err){
alert("❌ کێشەیەک ڕوویدا لە سڕینەوەی جۆر.");
console.error(err);
}

}

// ---------- Auth ----------

auth.onAuthStateChanged(function(user){

if(user){
document.getElementById("loginCard").classList.add("hidden");
document.getElementById("adminPanel").classList.remove("hidden");
document.getElementById("userLabel").textContent = "چوویتە ژوورەوە وەک: " + user.email;
}else{
document.getElementById("loginCard").classList.remove("hidden");
document.getElementById("adminPanel").classList.add("hidden");
}

});

function login(){

let email = document.getElementById("loginEmail").value.trim();
let password = document.getElementById("loginPassword").value;
let errorBox = document.getElementById("loginError");
let btn = document.getElementById("loginBtn");

errorBox.classList.add("hidden");

if(!email || !password){
errorBox.textContent = "تکایە ئیمەیل و وشەی نهێنی داخڵ بکە.";
errorBox.classList.remove("hidden");
return;
}

btn.disabled = true;
btn.textContent = "چاوەڕوان بە...";

auth.signInWithEmailAndPassword(email, password)
.catch(function(err){
errorBox.textContent = "❌ ئیمەیل یان وشەی نهێنی هەڵەیە.";
errorBox.classList.remove("hidden");
})
.finally(function(){
btn.disabled = false;
btn.textContent = "🔑 چوونەژوورەوە";
});

}

function logout(){
auth.signOut();
}

// ---------- Image handling (compressed, stored inline in Firestore - no paid storage needed) ----------

document.getElementById("productImageInput").addEventListener("change", function(e){
handleImageFile(e.target.files[0]);
});

function handleImageFile(file){

if(!file) return;

const reader = new FileReader();

reader.onload = function(e){

const img = new Image();

img.onload = function(){

const maxDim = 480;
let w = img.width;
let h = img.height;

if(w > h){
if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
}else{
if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
}

const canvas = document.createElement("canvas");
canvas.width = w;
canvas.height = h;
canvas.getContext("2d").drawImage(img, 0, 0, w, h);

currentImageData = canvas.toDataURL("image/jpeg", 0.6);

const preview = document.getElementById("imagePreview");
preview.src = currentImageData;
preview.classList.remove("hidden");

};

img.src = e.target.result;

};

reader.readAsDataURL(file);

}

// ---------- Products (live sync) ----------

db.collection("products").onSnapshot(function(snapshot){

products = snapshot.docs.map(doc=>({ id: doc.id, ...doc.data() }));

displayProducts();

});

function displayProducts(){

let list = document.getElementById("productList");

document.getElementById("totalCount").textContent =
"کۆی کاڵاکان: " + products.length;

if(products.length===0){

list.innerHTML=`
<div class="message">
هیچ کاڵایەک تۆمار نەکراوە.
</div>`;

return;

}

list.innerHTML="";

products.forEach((product)=>{

let item=document.createElement("div");

item.className="product";

let thumbHtml = product.image
? `<img class="product-thumb" src="${product.image}">`
: `<div class="product-thumb">📦</div>`;

item.innerHTML=`

${thumbHtml}

<div class="product-info">

<div class="product-name-small">
${product.name}
</div>

<div class="product-code">
بارکۆد: ${product.barcode}
<br>
جۆر: ${product.category || "-"}
<br>
نرخ: ${Number(product.price).toLocaleString()} دینار
</div>

</div>

<div class="btn-group">
<button class="edit-btn" onclick="startEdit('${product.id}')">✏️ دەستکاری</button>
<button class="delete" onclick="deleteProduct('${product.id}')">🗑️ سڕینەوە</button>
</div>

`;

list.appendChild(item);

});

}

function startEdit(id){

let product = products.find(p=>p.id===id);
if(!product) return;

editingId = id;

document.getElementById("productName").value = product.name;
document.getElementById("productBarcode").value = product.barcode;
document.getElementById("productPrice").value = product.price;
document.getElementById("productCategory").value = product.category || (categories[0] ? categories[0].name : "");

currentImageData = product.image || null;
document.getElementById("productImageInput").value = "";

const preview = document.getElementById("imagePreview");
if(currentImageData){
preview.src = currentImageData;
preview.classList.remove("hidden");
}else{
preview.classList.add("hidden");
}

document.getElementById("formTitle").textContent = "✏️ دەستکاریکردنی کاڵا";
document.getElementById("saveBtn").textContent = "💾 پاشەکەوتکردنی گۆڕانکاری";
document.getElementById("cancelEditBtn").classList.remove("hidden");

window.scrollTo({top:0, behavior:"smooth"});

}

function cancelEdit(){

editingId = null;
currentImageData = null;

document.getElementById("productName").value = "";
document.getElementById("productBarcode").value = "";
document.getElementById("productPrice").value = "";
document.getElementById("productCategory").value = categories[0] ? categories[0].name : "";
document.getElementById("productImageInput").value = "";

const preview = document.getElementById("imagePreview");
preview.classList.add("hidden");
preview.src = "";

document.getElementById("formTitle").textContent = "➕ زیادکردنی کاڵای نوێ";
document.getElementById("saveBtn").textContent = "💾 پاشەکەوتکردن";
document.getElementById("cancelEditBtn").classList.add("hidden");

}

async function saveProduct(){

let name = document.getElementById("productName").value.trim();
let barcode = document.getElementById("productBarcode").value.trim();
let price = Number(document.getElementById("productPrice").value);
let category = document.getElementById("productCategory").value;

if(name==="" || barcode==="" || price<=0){
alert("تکایە هەموو خانەکان پڕ بکەرەوە.");
return;
}

let duplicate = products.find(p=>p.barcode===barcode && p.id!==editingId);
if(duplicate){
alert("❌ ئەم بارکۆدە پێشتر هەیە.");
return;
}

const saveBtn = document.getElementById("saveBtn");
saveBtn.disabled = true;
saveBtn.textContent = "چاوەڕوان بە...";

let data = {
name:name,
barcode:barcode,
price:price,
category:category,
image:currentImageData || null
};

try{

if(editingId){

await db.collection("products").doc(editingId).update(data);

}else{

await db.collection("products").add(data);

}

cancelEdit();

}catch(err){

alert("❌ کێشەیەک ڕوویدا لە پاشەکەوتکردن. لەوانەیە وێنەکە زۆر گەورە بێت.");
console.error(err);

}

saveBtn.disabled = false;
saveBtn.textContent = editingId ? "💾 پاشەکەوتکردنی گۆڕانکاری" : "💾 پاشەکەوتکردن";

}

async function deleteProduct(id){

if(!confirm("دڵنیایت لە سڕینەوەی ئەم کاڵایە؟"))
return;

try{
await db.collection("products").doc(id).delete();
}catch(err){
alert("❌ کێشەیەک ڕوویدا لە سڕینەوە.");
console.error(err);
}

}

// ---------- Camera barcode scanner (for filling the barcode field, html5-qrcode) ----------

function openScanner(){

document.getElementById("scannerOverlay").classList.remove("hidden");

if(!html5QrCode){
html5QrCode = new Html5Qrcode("scannerBox");
}

html5QrCode.start(
{ facingMode:"environment" },
{
fps:10,
qrbox:{ width:250, height:130 },
formatsToSupport:[
Html5QrcodeSupportedFormats.EAN_13,
Html5QrcodeSupportedFormats.EAN_8,
Html5QrcodeSupportedFormats.UPC_A,
Html5QrcodeSupportedFormats.UPC_E,
Html5QrcodeSupportedFormats.CODE_128
]
},
function(decodedText){
if(!scannerActive) return;
document.getElementById("productBarcode").value = decodedText;
closeScanner();
},
function(errorMessage){
// ignore per-frame decode misses
}
).then(function(){
scannerActive = true;
}).catch(function(err){
alert("❌ کامیرا نەدۆزرایەوە یان ڕێگە نەدرا");
closeScanner();
console.error(err);
});

}

function closeScanner(){

if(scannerActive && html5QrCode){
html5QrCode.stop().then(function(){
html5QrCode.clear();
}).catch(function(){});
}

scannerActive = false;

document.getElementById("scannerOverlay").classList.add("hidden");

}

</script>

</body>
</html>
